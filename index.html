<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>彩球消消乐</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050f;--panel:#0c0c1e;--border:#1a1a38;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% 0%,rgba(59,158,255,.07) 0%,transparent 70%),
    repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.015) 40px),
    repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.015) 40px);
  font-family:'Noto Sans SC',sans-serif;color:#fff;user-select:none;
  display:flex;flex-direction:column;
}

/* ═══════════ DESKTOP layout ═══════════ */
.desktop-wrap{
  display:flex;gap:20px;align-items:flex-start;
  justify-content:center;align-items:center;
  flex:1;padding:20px;
  filter:drop-shadow(0 0 40px rgba(59,158,255,.1));
}
#board{border:2px solid #1e1e42;border-radius:8px;display:block;flex-shrink:0;
  box-shadow:0 0 0 1px #0a0a20,0 0 30px rgba(59,158,255,.08);background:#060612;}
.panel{width:164px;display:flex;flex-direction:column;gap:13px;}

/* ═══════════ MOBILE layout ═══════════ */
.mobile-wrap{display:none;flex-direction:column;height:100%;overflow:hidden;}

/* top bar */
.m-topbar{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.m-topbar .logo{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:2px;}
.m-topbar .logo .l1{color:#ff3b5c;} .m-topbar .logo .l2{color:#3b9eff;} .m-topbar .logo .l3{color:#3bffb0;}
.m-stat{display:flex;flex-direction:column;align-items:center;background:#111128;border-radius:8px;padding:4px 10px;min-width:52px;}
.m-stat .lbl{font-size:8px;letter-spacing:2px;color:#3a3a5c;font-family:'Orbitron',monospace;text-transform:uppercase;}
.m-stat .val{font-family:'Orbitron',monospace;font-size:18px;font-weight:700;color:#e8e8ff;}
.val.flash{animation:flash .3s ease;}
@keyframes flash{0%,100%{color:#e8e8ff}50%{color:#ffe03b;text-shadow:0 0 12px #ffe03b;}}
.m-topbar-right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.m-next-label{font-size:8px;letter-spacing:2px;color:#3a3a5c;font-family:'Orbitron',monospace;text-transform:uppercase;margin-bottom:2px;text-align:center;}

/* board area */
.m-board-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  overflow:hidden;min-height:0;
}
#board-mobile{border:2px solid #1e1e42;border-radius:8px;display:block;
  box-shadow:0 0 0 1px #0a0a20,0 0 20px rgba(59,158,255,.08);background:#060612;}

/* ── Virtual D-pad ── */
.dpad-wrap{
  flex-shrink:0;
  background:rgba(0,0,0,.3);
  border-top:1px solid #111128;
  padding:10px 16px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.dpad{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;width:200px;}
.dp{
  border:none;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;
  cursor:pointer;active:opacity:.7;
  background:linear-gradient(145deg,#1a1a38,#0d0d20);
  border:1px solid #222244;
  box-shadow:0 4px 0 #080818, 0 0 12px rgba(59,158,255,.08);
  height:64px;
  transition:transform .08s,box-shadow .08s;
  -webkit-touch-callout:none;
}
.dp:active,.dp.pressed{
  transform:translateY(3px);
  box-shadow:0 1px 0 #080818;
  background:linear-gradient(145deg,#222246,#141428);
}
.dp-left {grid-column:1;grid-row:1/3;}
.dp-rot  {grid-column:2;grid-row:1;background:linear-gradient(145deg,#0d2a4a,#071828);border-color:#1a3a5a;}
.dp-right{grid-column:3;grid-row:1/3;}
.dp-drop {grid-column:2;grid-row:2;background:linear-gradient(145deg,#2a1028,#180818);border-color:#3a1a3a;}
.dpad-side{display:flex;flex-direction:column;gap:8px;align-items:center;}
.dp-pause-m{
  border:none;border-radius:12px;padding:10px 14px;
  background:linear-gradient(135deg,#1a5a8a,#0d3360);border:1px solid #2a5a9a;
  color:#fff;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  letter-spacing:1px;cursor:pointer;width:72px;
  box-shadow:0 3px 0 #060a14;
}
.dp-pause-m.active{background:linear-gradient(135deg,#8a6a00,#5a4400);border-color:#aa8800;}
.dp-new-m{
  border:none;border-radius:12px;padding:10px 14px;
  background:linear-gradient(135deg,#c0182e,#7a1ab0);
  color:#fff;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;
  letter-spacing:1px;cursor:pointer;width:72px;
  box-shadow:0 3px 0 #400010;
}

/* ═══════════ SHARED ═══════════ */
.logo{font-family:'Orbitron',monospace;font-size:19px;font-weight:900;letter-spacing:2px;line-height:1.4;}
.logo em{display:block;font-style:normal;}
.l1{color:#ff3b5c;text-shadow:0 0 14px #ff3b5c;}
.l2{color:#3b9eff;text-shadow:0 0 14px #3b9eff;}
.l3{color:#3bffb0;text-shadow:0 0 14px #3bffb0;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 14px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);}
.lbl{font-size:9px;letter-spacing:3px;color:#3a3a5c;text-transform:uppercase;font-family:'Orbitron',monospace;}
.val{font-family:'Orbitron',monospace;font-size:26px;font-weight:700;color:#e8e8ff;margin-top:3px;}
.next-wrap{display:flex;justify-content:center;margin-top:8px;}
.ctrl-card{font-size:11px;color:#33335a;line-height:2.4;}
.ctrl-card b{display:block;color:#25253a;font-size:9px;letter-spacing:3px;margin-bottom:3px;font-family:'Orbitron',monospace;}
kbd{display:inline-block;background:#111128;border:1px solid #22224a;border-radius:4px;padding:0 6px;color:#5555aa;font-size:10px;font-family:monospace;margin:0 2px;box-shadow:0 2px 0 #0a0a20;}
.diff-badge{display:inline-block;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;padding:3px 8px;border-radius:20px;border:1px solid;margin-top:4px;}
.diff-badge.d0{color:#3bffb0;border-color:#3bffb0;background:rgba(59,255,176,.07);}
.diff-badge.d1{color:#ffe03b;border-color:#ffe03b;background:rgba(255,224,59,.07);}
.diff-badge.d2{color:#ff3b5c;border-color:#ff3b5c;background:rgba(255,59,92,.07);}
.diff-badge.d3{color:#c13bff;border-color:#c13bff;background:rgba(193,59,255,.07);}
.btn-row{display:flex;gap:8px;}
.btn{position:relative;overflow:hidden;color:#fff;border:none;padding:12px 0;border-radius:10px;font-size:12px;font-weight:700;font-family:'Orbitron',monospace;letter-spacing:1px;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:hover{opacity:.88;transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);pointer-events:none;}
.btn-new{flex:1.4;background:linear-gradient(135deg,#c0182e,#7a1ab0);box-shadow:0 4px 20px rgba(193,56,255,.2);}
.btn-pause{flex:1;background:linear-gradient(135deg,#1a5a8a,#0d3360);border:1px solid #2a5a9a;}
.btn-pause.active{background:linear-gradient(135deg,#8a6a00,#5a4400);border-color:#aa8800;}
.btn:disabled{opacity:.3;cursor:default;transform:none;}
#msg{font-size:11px;color:#333355;text-align:center;font-family:'Orbitron',monospace;letter-spacing:1px;min-height:16px;}
#combo-el{position:fixed;pointer-events:none;font-family:'Orbitron',monospace;font-weight:900;font-size:42px;color:#ffe03b;text-shadow:0 0 20px #ffe03b,0 0 40px #ff6b00;opacity:0;transition:opacity .3s,transform .3s;z-index:200;}

/* ─── Modal ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:300;opacity:0;pointer-events:none;transition:opacity .25s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal-box{background:#0d0d22;border:1px solid #252550;border-radius:20px;padding:28px 24px;width:min(330px,92vw);box-shadow:0 0 60px rgba(59,158,255,.15);transform:scale(.92);transition:transform .25s;}
.modal-overlay.show .modal-box{transform:scale(1);}
.modal-title{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;letter-spacing:4px;color:#7788cc;text-align:center;margin-bottom:20px;}
.diff-cards{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.diff-card{background:#111130;border:2px solid #1e1e40;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s,background .15s;}
.diff-card:hover,.diff-card:active{background:#14142a;border-color:#333366;}
.diff-card.selected.d0{border-color:#3bffb0;background:rgba(59,255,176,.06);}
.diff-card.selected.d1{border-color:#ffe03b;background:rgba(255,224,59,.06);}
.diff-card.selected.d2{border-color:#ff3b5c;background:rgba(255,59,92,.06);}
.diff-card.selected.d3{border-color:#c13bff;background:rgba(193,59,255,.06);}
.diff-name{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;color:#ccd0ff;letter-spacing:3px;}
.diff-sub{font-size:11px;color:#444466;letter-spacing:1px;margin-top:3px;}
.diff-right{display:flex;gap:5px;align-items:center;}
.color-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.modal-start{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#1a7acc,#8a1ab0);color:#fff;font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 24px rgba(100,100,255,.2);transition:opacity .15s;}
.modal-start:active{opacity:.8;}

/* ═══════════ RESPONSIVE ═══════════ */
@media (max-width: 600px), (max-height: 700px) and (orientation: portrait) {
  .desktop-wrap{display:none;}
  .mobile-wrap{display:flex;}
}
</style>
</head>
<body>
<div id="combo-el"></div>

<!-- ═══ MODAL ═══ -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <div class="modal-title">选 择 难 度</div>
    <div class="diff-cards" id="diffCards"></div>
    <button class="modal-start" id="modalStart">开 始 游 戏</button>
  </div>
</div>

<!-- ═══ DESKTOP ═══ -->
<div class="desktop-wrap">
  <canvas id="board"></canvas>
  <div class="panel">
    <div class="logo"><em class="l1">彩 球</em><em class="l2">消 消</em><em class="l3">乐!</em></div>
    <div class="card"><div class="lbl">得 分</div><div class="val" id="se">0</div></div>
    <div class="card"><div class="lbl">关 卡</div><div class="val" id="le">1</div></div>
    <div class="card"><div class="lbl">难 度</div><div id="diffBadge" class="diff-badge d0" style="display:none"></div></div>
    <div class="card"><div class="lbl">下一组</div><div class="next-wrap"><canvas id="nc" width="46" height="138"></canvas></div></div>
    <div class="card ctrl-card">
      <b>操 作 说 明</b>
      <kbd>←</kbd><kbd>→</kbd> 左右移动<br>
      <kbd>↑</kbd> 旋转 90°<br>
      <kbd>↓</kbd> 瞬间落底<br>
      <kbd>Space</kbd> 暂停 / 继续
    </div>
    <div class="btn-row">
      <button class="btn btn-new" id="sb">新游戏</button>
      <button class="btn btn-pause" id="pb" disabled>暂停</button>
    </div>
    <div id="msg"></div>
  </div>
</div>

<!-- ═══ MOBILE ═══ -->
<div class="mobile-wrap">

  <!-- top info bar -->
  <div class="m-topbar">
    <div class="logo" style="font-size:13px;line-height:1.2">
      <em class="l1" style="display:inline">彩球</em>
      <em class="l2" style="display:inline">消消</em>
      <em class="l3" style="display:inline">乐</em>
    </div>
    <div class="m-stat"><div class="lbl">得分</div><div class="val" id="se-m">0</div></div>
    <div class="m-stat"><div class="lbl">关卡</div><div class="val" id="le-m">1</div></div>
    <div class="m-topbar-right">
      <div>
        <div class="m-next-label">下一组</div>
        <canvas id="nc-m" width="32" height="96"></canvas>
      </div>
    </div>
  </div>

  <!-- board -->
  <div class="m-board-wrap">
    <canvas id="board-mobile"></canvas>
  </div>

  <!-- D-pad -->
  <div class="dpad-wrap">
    <div class="dpad">
      <button class="dp dp-left"  id="dp-left" >◀</button>
      <button class="dp dp-rot"   id="dp-rot"  >↺</button>
      <button class="dp dp-right" id="dp-right">▶</button>
      <button class="dp dp-drop"  id="dp-drop" >▼</button>
    </div>
    <div class="dpad-side">
      <button class="dp-new-m"   id="sb-m">新游戏</button>
      <button class="dp-pause-m" id="pb-m" disabled>暂停</button>
      <div id="msg-m" style="font-size:9px;color:#333355;font-family:monospace;text-align:center;min-height:12px;"></div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  PALETTE
// ═══════════════════════════════════════
const ALL_PAL=['#ff3b5c','#3b9eff','#3bffb0','#ffe03b','#c13bff','#ff8c00'];
const ALL_LIT=['#ff9ab0','#99d0ff','#99ffe0','#fff099','#e099ff','#ffcc77'];
const ALL_GLO=['rgba(255,59,92,.5)','rgba(59,158,255,.5)','rgba(59,255,176,.5)','rgba(255,224,59,.5)','rgba(193,59,255,.5)','rgba(255,140,0,.5)'];
const DIRS=[[-1,0],[1,0],[0,-1],[0,1]];

// ═══════════════════════════════════════
//  DIFFICULTY
// ═══════════════════════════════════════
const DIFF=[
  {cols:8, nc:4,label:'初级',badge:'d0',baseSpeed:700,speedUp:50},
  {cols:9, nc:5,label:'中级',badge:'d1',baseSpeed:620,speedUp:55},
  {cols:10,nc:6,label:'高级',badge:'d2',baseSpeed:540,speedUp:60},
  {cols:10,nc:6,label:'超级',badge:'d3',baseSpeed:400,speedUp:70},
];
const ROWS=14;
let SZ=46;  // cell size, recalculated for mobile
let selDiff=0;
let COLS,NC,BSPD,SPDUP;

// ── is mobile? ──
const isMobile=()=>window.innerWidth<=600||(window.innerWidth<window.innerHeight&&window.innerWidth<700);

function buildModal(){
  const wrap=document.getElementById('diffCards');
  wrap.innerHTML='';
  DIFF.forEach((d,i)=>{
    const card=document.createElement('div');
    card.className=`diff-card ${d.badge}${i===selDiff?' selected':''}`;
    card.dataset.d=i;
    const dots=Array.from({length:d.nc},(_,k)=>
      `<div class="color-dot" style="background:${ALL_PAL[k]};box-shadow:0 0 5px ${ALL_PAL[k]}"></div>`
    ).join('');
    card.innerHTML=`<div><div class="diff-name">${d.label}</div><div class="diff-sub">${d.nc} 种颜色 · ${d.cols} 列</div></div><div class="diff-right">${dots}</div>`;
    card.addEventListener('click',()=>{
      wrap.querySelectorAll('.diff-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');selDiff=i;
    });
    wrap.appendChild(card);
  });
}
buildModal();

// ═══════════════════════════════════════
//  CANVAS  (desktop + mobile)
// ═══════════════════════════════════════
const board    = document.getElementById('board');
const gx       = board.getContext('2d');
const boardM   = document.getElementById('board-mobile');
const gxM      = boardM.getContext('2d');
const ncEl     = document.getElementById('nc');
const nx       = ncEl.getContext('2d');
const ncElM    = document.getElementById('nc-m');
const nxM      = ncElM.getContext('2d');

function activeCanvas(){ return isMobile()?boardM:board; }
function activeCtx()   { return isMobile()?gxM:gx; }
function activeNcEl()  { return isMobile()?ncElM:ncEl; }
function activeNx()    { return isMobile()?nxM:nx; }

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let G,P,NP;
let score,level,combo;
let running,settling,over,paused;
let DI,dt_drop,dt_last,animId;
let particles=[],flashCells=null;

const rnd=()=>Math.floor(Math.random()*NC);

// ═══════════════════════════════════════
//  PIECE
// ═══════════════════════════════════════
function mkP(){
  let c;
  do{c=[rnd(),rnd(),rnd()];}while(c[0]===c[1]&&c[1]===c[2]);
  return{col:Math.floor(COLS/2),row:-2,ori:'v',c};
}

function cells(p){
  return p.ori==='v'
    ?[[p.col,p.row],[p.col,p.row+1],[p.col,p.row+2]]
    :[[p.col,p.row],[p.col+1,p.row],[p.col+2,p.row]];
}
function ok(p){
  for(const[c,r]of cells(p)){
    if(c<0||c>=COLS||r>=ROWS)return false;
    if(r>=0&&G[r][c]!==null)return false;
  }
  return true;
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
function calcSZ(){
  if(!isMobile()){SZ=46;return;}
  const d=DIFF[selDiff];
  const topbarH=60,dpadH=175,margin=8;
  const availW=window.innerWidth-8;
  const availH=window.innerHeight-topbarH-dpadH-margin;
  const szByW=Math.floor(availW/d.cols);
  const szByH=Math.floor(availH/ROWS);
  SZ=Math.min(szByW,szByH,46);
  SZ=Math.max(SZ,20);
}

function initGame(di){
  const d=DIFF[di];
  COLS=d.cols;NC=d.nc;BSPD=d.baseSpeed;SPDUP=d.speedUp;
  calcSZ();

  // size both canvases (only one will be visible)
  board.width=COLS*SZ;   board.height=ROWS*SZ;
  boardM.width=COLS*SZ;  boardM.height=ROWS*SZ;

  G=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0;level=1;combo=0;
  running=true;settling=false;over=false;paused=false;
  DI=BSPD;dt_drop=0;dt_last=0;
  particles=[];flashCells=null;

  NP=mkP();spawn();
  syncUI();

  const badge=document.getElementById('diffBadge');
  badge.textContent=d.label;badge.className='diff-badge '+d.badge;badge.style.display='block';

  // desktop controls
  const pb=document.getElementById('pb');
  pb.disabled=false;pb.textContent='暂停';pb.classList.remove('active');
  // mobile controls
  const pbm=document.getElementById('pb-m');
  pbm.disabled=false;pbm.textContent='暂停';pbm.classList.remove('active');

  document.getElementById('msg').textContent='';
  document.getElementById('msg-m').textContent='';

  if(animId)cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
}

function syncUI(){
  document.getElementById('se').textContent=score;
  document.getElementById('le').textContent=level;
  document.getElementById('se-m').textContent=score;
  document.getElementById('le-m').textContent=level;
}

function spawn(){
  P={col:Math.floor(COLS/2),row:-2,ori:'v',c:[...NP.c]};
  NP=mkP();
  if(G[0]&&G[0][P.col]!==null)endGame();
}

// ═══════════════════════════════════════
//  MOVEMENT
// ═══════════════════════════════════════
function moveP(d){const np={...P,col:P.col+d};if(ok(np))P.col=np.col;}
function rotateP(){
  let np;
  if(P.ori==='v'){
    np={col:P.col-1,row:P.row+1,ori:'h',c:[P.c[2],P.c[1],P.c[0]]};
    if(np.col<0)np.col=0;
    if(np.col+2>=COLS)np.col=COLS-3;
  }else{
    np={col:P.col+1,row:P.row-1,ori:'v',c:[P.c[0],P.c[1],P.c[2]]};
    if(np.row<-2)np.row=-2;
    if(np.row+2>=ROWS)np.row=ROWS-3;
  }
  if(ok(np))P=np;
}
function stepDown(){const np={...P,row:P.row+1};if(ok(np))P=np;else place();}
function hardDrop(){while(ok({...P,row:P.row+1}))P={...P,row:P.row+1};place();}

// ═══════════════════════════════════════
//  PLACEMENT (per-column floor drop)
// ═══════════════════════════════════════
function place(){
  const cs=cells(P);
  for(let i=cs.length-1;i>=0;i--){
    const[c,r]=cs[i];
    if(c<0||c>=COLS)continue;
    const from=Math.max(r,0);
    if(from>=ROWS)continue;
    let floor=from;
    while(floor+1<ROWS&&G[floor+1][c]===null)floor++;
    G[floor][c]=P.c[i];
  }
  combo=0;settling=true;
  matchAndClear();
}

function gravity(){
  for(let c=0;c<COLS;c++){
    let w=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(G[r][c]!==null){G[w][c]=G[r][c];if(w!==r)G[r][c]=null;w--;}
    }
  }
}

// ═══════════════════════════════════════
//  MATCH (flood-fill BFS, ≥3 connected)
// ═══════════════════════════════════════
function findMatches(){
  const mark=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const visited=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  let found=false;
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(visited[r][c]||G[r][c]===null)continue;
      const color=G[r][c];
      const group=[];
      const queue=[[r,c]];
      visited[r][c]=true;
      while(queue.length>0){
        const[cr,cc]=queue.shift();
        group.push([cr,cc]);
        for(const[dr,dc]of DIRS){
          const nr=cr+dr,nc2=cc+dc;
          if(nr>=0&&nr<ROWS&&nc2>=0&&nc2<COLS&&!visited[nr][nc2]&&G[nr][nc2]===color){
            visited[nr][nc2]=true;queue.push([nr,nc2]);
          }
        }
      }
      if(group.length>=3){group.forEach(([gr,gc])=>mark[gr][gc]=true);found=true;}
    }
  }
  return found?mark:null;
}

function matchAndClear(){
  const m=findMatches();
  if(!m){settling=false;spawn();return;}
  combo++;flashCells=m;
  const toRemove=[];let cnt=0;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(m[r][c]){toRemove.push([c,r,G[r][c]]);cnt++;}
  if(combo>1)showCombo(combo);
  score+=cnt*10*combo;
  level=Math.max(1,Math.floor(score/(COLS*80))+1);
  DI=Math.max(120,BSPD-(level-1)*SPDUP);
  setScore(score);setLevel(level);
  setTimeout(()=>{
    flashCells=null;
    toRemove.forEach(([c,r,ci])=>{
      const x=c*SZ+SZ/2,y=r*SZ+SZ/2;
      for(let i=0;i<9;i++)spawnParticle(x,y,ci);
      G[r][c]=null;
    });
    gravity();matchAndClear();
  },320);
}

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
function endGame(){
  running=false;over=true;
  document.getElementById('msg').textContent='游戏结束！';
  document.getElementById('msg-m').textContent='游戏结束！';
  document.getElementById('pb').disabled=true;
  document.getElementById('pb-m').disabled=true;
}

function togglePause(){
  if(!running||over)return;
  paused=!paused;
  ['pb','pb-m'].forEach(id=>{
    const el=document.getElementById(id);
    el.textContent=paused?'继续':'暂停';
    el.classList.toggle('active',paused);
  });
  document.getElementById('msg').textContent=paused?'— 已暂停 —':'';
  document.getElementById('msg-m').textContent=paused?'已暂停':'';
  if(!paused)dt_last=0;
}

function setScore(v){
  score=v;
  ['se','se-m'].forEach(id=>{
    const el=document.getElementById(id);
    el.textContent=v;
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  });
}
function setLevel(v){
  level=v;
  document.getElementById('le').textContent=v;
  document.getElementById('le-m').textContent=v;
}

// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
function spawnParticle(x,y,ci){
  const a=Math.random()*Math.PI*2,spd=2+Math.random()*5;
  particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,ci,life:1,decay:.025+Math.random()*.035,r:3+Math.random()*6});
}
function updateParticles(){
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.decay;p.r*=.97;});
}

// ═══════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════
const BR_BASE=SZ/2-3;

function drawBall(ctx,x,y,ci,alpha=1,scale=1){
  const BR=SZ/2-3;
  const r=BR*scale;
  ctx.save();ctx.globalAlpha=alpha;
  if(alpha>.3){
    const gw=ctx.createRadialGradient(x,y,r*.4,x,y,r*2.2);
    gw.addColorStop(0,ALL_GLO[ci]);gw.addColorStop(1,'transparent');
    ctx.beginPath();ctx.arc(x,y,r*2.2,0,Math.PI*2);ctx.fillStyle=gw;ctx.fill();
  }
  const g=ctx.createRadialGradient(x-r*.32,y-r*.38,r*.04,x,y,r);
  g.addColorStop(0,'#fff');g.addColorStop(.2,ALL_LIT[ci]);
  g.addColorStop(.65,ALL_PAL[ci]);g.addColorStop(1,ALL_PAL[ci]+'88');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  const sh=ctx.createRadialGradient(x-r*.3,y-r*.38,0,x-r*.3,y-r*.38,r*.52);
  sh.addColorStop(0,'rgba(255,255,255,.76)');sh.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=sh;ctx.fill();
  ctx.restore();
}

function ghostPiece(){
  let gp={...P};
  while(ok({...gp,row:gp.row+1}))gp={...gp,row:gp.row+1};
  return gp;
}

function drawFrame(ctx,ncCtx,ncCanvas,ts){
  const w=COLS*SZ,h=ROWS*SZ;
  ctx.fillStyle='#060612';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#0e0e28';ctx.lineWidth=1;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)ctx.strokeRect(c*SZ+.5,r*SZ+.5,SZ-1,SZ-1);

  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(G[r][c]===null)continue;
    if(flashCells&&flashCells[r][c]){
      const pulse=.5+.5*Math.sin(ts*.045);
      drawBall(ctx,c*SZ+SZ/2,r*SZ+SZ/2,G[r][c],.35+pulse*.65,1+pulse*.18);
    }else{
      drawBall(ctx,c*SZ+SZ/2,r*SZ+SZ/2,G[r][c]);
    }
  }

  if(running&&P&&!settling&&!paused){
    const gp=ghostPiece();
    cells(gp).forEach(([c,r],i)=>{if(r>=0)drawBall(ctx,c*SZ+SZ/2,r*SZ+SZ/2,P.c[i],.12);});
  }
  if(running&&P&&!settling)
    cells(P).forEach(([c,r],i)=>{if(r>=0)drawBall(ctx,c*SZ+SZ/2,r*SZ+SZ/2,P.c[i]);});

  particles.forEach(p=>{
    ctx.save();ctx.globalAlpha=p.life;
    ctx.fillStyle=ALL_PAL[p.ci];ctx.shadowColor=ALL_PAL[p.ci];ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  if(paused){
    ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,w,h);
    ctx.textAlign='center';
    ctx.font=`bold ${Math.round(SZ*.65)}px Orbitron,monospace`;
    ctx.fillStyle='#ffe03b';ctx.shadowColor='#ffe03b';ctx.shadowBlur=20;
    ctx.fillText('PAUSED',w/2,h/2);
    ctx.shadowBlur=0;
    ctx.font=`${Math.round(SZ*.27)}px Noto Sans SC,sans-serif`;ctx.fillStyle='#555';
    ctx.fillText('点击「继续」恢复',w/2,h/2+SZ*.8);
  }
  if(over){
    ctx.fillStyle='rgba(0,0,0,.77)';ctx.fillRect(0,0,w,h);
    ctx.textAlign='center';
    ctx.font=`bold ${Math.round(SZ*.65)}px Orbitron,monospace`;
    ctx.fillStyle='#ff3b5c';ctx.shadowColor='#ff3b5c';ctx.shadowBlur=22;
    ctx.fillText('GAME OVER',w/2,h/2-SZ*.5);
    ctx.shadowBlur=0;
    ctx.font=`${Math.round(SZ*.35)}px Orbitron,monospace`;ctx.fillStyle='#3b9eff';
    ctx.fillText('得分 '+score,w/2,h/2+SZ*.2);
    ctx.font=`${Math.round(SZ*.27)}px Noto Sans SC,sans-serif`;ctx.fillStyle='#444466';
    ctx.fillText('点击「新游戏」重来',w/2,h/2+SZ*.9);
  }

  // next piece preview
  const ncSZ=ncCanvas.width/1;
  const ballR=(ncCanvas.width/2)-3;
  ncCtx.clearRect(0,0,ncCanvas.width,ncCanvas.height);
  if(NP){
    for(let i=0;i<3;i++){
      const px=ncCanvas.width/2,py=i*(ncCanvas.height/3)+ncCanvas.height/6;
      // draw scaled ball
      const r=ballR;
      ncCtx.save();
      const gw=ncCtx.createRadialGradient(px,py,r*.4,px,py,r*2);
      gw.addColorStop(0,ALL_GLO[NP.c[i]]);gw.addColorStop(1,'transparent');
      ncCtx.beginPath();ncCtx.arc(px,py,r*2,0,Math.PI*2);ncCtx.fillStyle=gw;ncCtx.fill();
      const g=ncCtx.createRadialGradient(px-r*.32,py-r*.38,r*.04,px,py,r);
      g.addColorStop(0,'#fff');g.addColorStop(.2,ALL_LIT[NP.c[i]]);
      g.addColorStop(.65,ALL_PAL[NP.c[i]]);g.addColorStop(1,ALL_PAL[NP.c[i]]+'88');
      ncCtx.beginPath();ncCtx.arc(px,py,r,0,Math.PI*2);ncCtx.fillStyle=g;ncCtx.fill();
      const sh=ncCtx.createRadialGradient(px-r*.3,py-r*.38,0,px-r*.3,py-r*.38,r*.52);
      sh.addColorStop(0,'rgba(255,255,255,.72)');sh.addColorStop(1,'rgba(255,255,255,0)');
      ncCtx.beginPath();ncCtx.arc(px,py,r,0,Math.PI*2);ncCtx.fillStyle=sh;ncCtx.fill();
      ncCtx.restore();
    }
  }
}

function draw(ts){
  if(isMobile()){
    drawFrame(gxM,nxM,ncElM,ts);
  }else{
    drawFrame(gx,nx,ncEl,ts);
  }
}

// ═══════════════════════════════════════
//  COMBO
// ═══════════════════════════════════════
let comboTO;
function showCombo(n){
  const el=document.getElementById('combo-el');
  const cvs=activeCanvas();
  const rect=cvs.getBoundingClientRect();
  el.textContent=n+'x COMBO!';
  el.style.left=(rect.left+rect.width/2)+'px';
  el.style.top=(rect.top+rect.height/2)+'px';
  el.style.transform='translate(-50%,-50%) scale(1.3)';
  el.style.opacity='1';
  clearTimeout(comboTO);
  comboTO=setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,-50%) scale(1)';},700);
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
function loop(t){
  if(dt_last===0)dt_last=t;
  const delta=Math.min(t-dt_last,100);dt_last=t;
  if(running&&!settling&&!paused){
    dt_drop+=delta;
    if(dt_drop>=DI){dt_drop=0;stepDown();}
  }
  updateParticles();draw(t);
  animId=requestAnimationFrame(loop);
}

// ═══════════════════════════════════════
//  KEYBOARD INPUT
// ═══════════════════════════════════════
const ARROWS=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown']);
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();togglePause();return;}
  if(!ARROWS.has(e.key))return;
  e.preventDefault();
  if(!running||settling||paused||over)return;
  switch(e.key){
    case'ArrowLeft': moveP(-1);  break;
    case'ArrowRight':moveP(1);   break;
    case'ArrowUp':   rotateP();  break;
    case'ArrowDown': hardDrop(); break;
  }
});

// ═══════════════════════════════════════
//  VIRTUAL BUTTON TOUCH INPUT
//  Use touchstart (no 300ms delay) + preventDefault
// ═══════════════════════════════════════
function dpBtn(id,action){
  const el=document.getElementById(id);
  function fire(e){
    e.preventDefault();
    if(!running||settling||paused||over)return;
    action();
    el.classList.add('pressed');
  }
  function unpress(){el.classList.remove('pressed');}
  el.addEventListener('touchstart',fire,{passive:false});
  el.addEventListener('touchend',unpress,{passive:true});
  el.addEventListener('mousedown',fire);
  el.addEventListener('mouseup',unpress);
}

dpBtn('dp-left',  ()=>moveP(-1));
dpBtn('dp-right', ()=>moveP(1));
dpBtn('dp-rot',   ()=>rotateP());
dpBtn('dp-drop',  ()=>hardDrop());

//  MODAL + CONTROL BUTTONS

function openModal(){buildModal();document.getElementById('modal').classList.add('show');}
function closeModal(){document.getElementById('modal').classList.remove('show');}

document.getElementById('modalStart').addEventListener('click',()=>{closeModal();initGame(selDiff);});
['sb','sb-m'].forEach(id=>document.getElementById(id).addEventListener('click',openModal));
['pb','pb-m'].forEach(id=>document.getElementById(id).addEventListener('click',togglePause));

// initial sizing
board.width=DIFF[0].cols*46; board.height=ROWS*46;
boardM.width=DIFF[0].cols*46; boardM.height=ROWS*46;
animId=requestAnimationFrame(loop);
openModal();
</script>
